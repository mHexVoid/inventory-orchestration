# ------------------------------------------------------------------------------
# Application Identity
# ------------------------------------------------------------------------------
# Name of the Spring Boot application. Used in logs and Actuator endpoints.
spring.application.name=inventory.orchestration
server.port=8080


# ------------------------------------------------------------------------------
# Database Configuration
# ------------------------------------------------------------------------------
# JDBC connection URL for the MySQL database.
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_orchestration

# Database credentials.
spring.datasource.username=oneuser
spring.datasource.password=oneuser99

# Hibernate DDL auto strategy:
# 'update' will automatically update the schema to match entity definitions.
# Recommended only for development. Use migrations (Flyway/Liquibase) in production.

#spring.jpa.hibernate.ddl-auto=update


# ------------------------------------------------------------------------------
# SpringDoc OpenAPI / Swagger Configuration
# ------------------------------------------------------------------------------

# Enable OpenAPI specification endpoint (e.g., /v3/api-docs).
springdoc.api-docs.enabled=true

# Enable Swagger UI interface for testing APIs.
springdoc.swagger-ui.enabled=true

# Disable Spring Security integration with Swagger (useful when endpoints are secured).
springdoc.enable-spring-security=false


# ------------------------------------------------------------------------------
# JPA / Hibernate SQL Logging (Development Only)
# ------------------------------------------------------------------------------

# Enables logging of raw SQL statements generated by Hibernate.
# This is useful for debugging but should be disabled in production.
#this will cause to show again if show sql true
#logging.level.org.hibernate.SQL=DEBUG

# Logs parameter values bound to SQL queries (e.g., where ? = value).
# TRACE is very verbose; avoid enabling in production.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# For older Hibernate versions to log SQL type bindings.
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Display SQL queries in the console (redundant if SQL logging is enabled).
spring.jpa.show-sql=true

# Pretty-prints SQL queries to improve readability.
spring.jpa.properties.hibernate.format_sql=true


# ------------------------------------------------------------------------------
# Spring JDBC Logging (Development Only)
# ------------------------------------------------------------------------------

# Enables debug logging for Spring's JDBC operations.
# Useful when using JdbcTemplate or for diagnosing low-level DB calls.
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG


# ------------------------------------------------------------------------------
# Spring Security Logging (Development Only)
# ------------------------------------------------------------------------------

# Logs detailed Spring Security behavior, including filter chains and auth events.
# TRACE is helpful during debugging but should be turned off in production.
logging.level.org.springframework.security=TRACE


# ------------------------------------------------------------------------------
# Application-Level Logging (Optional)
# ------------------------------------------------------------------------------

# Enables debug-level logging for application classes (adjust the package as needed).
# Useful for tracing controller, service, or repository actions.
logging.level.com.hexvoid=DEBUG


# ------------------------------------------------------------------------------
# Spring Transaction Management Logging (Optional)
# ------------------------------------------------------------------------------

# Uncomment this line to trace transaction lifecycle (begin, commit, rollback).
# Only enable this when debugging complex transaction flows.
# logging.level.org.springframework.transaction=DEBUG


# ------------------------------------------------------------------------------
# IMPORTANT:
# Do not enable TRACE or DEBUG logging in production environments.
# These levels can expose sensitive data, degrade performance, and produce large logs.
# ------------------------------------------------------------------------------






